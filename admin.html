<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CORTIS 预约管理</title>
  <style>
    :root {
      --ink: #172026;
      --muted: #66727c;
      --line: #d9e0e5;
      --paper: #f7f8f5;
      --panel: #ffffff;
      --teal: #0f766e;
      --teal-dark: #0a4f4b;
      --coral: #e35d4f;
      --gold: #c69229;
      --shadow: 0 18px 46px rgba(23, 32, 38, 0.10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }

    button, input, select { font: inherit; }

    .shell {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 22px 16px 44px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: 0;
    }

    .sub {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 150px auto auto;
      gap: 10px;
      align-items: end;
      margin-bottom: 14px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    input, select {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 11px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }

    button {
      border: 0;
      border-radius: 8px;
      min-height: 42px;
      padding: 0 13px;
      color: #fff;
      background: var(--teal-dark);
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary { background: #34414a; }
    button.warn { background: var(--coral); }
    button.gold { background: var(--gold); }
    button[disabled] { opacity: .6; cursor: wait; }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px;
      background: #fff;
      min-height: 72px;
    }

    .stat b {
      display: block;
      font-size: 22px;
      line-height: 1.1;
    }

    .stat span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
      background: #fff;
    }

    th, td {
      padding: 11px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 13px;
      vertical-align: middle;
    }

    th {
      color: var(--muted);
      font-weight: 700;
      background: #f3f5f4;
      position: sticky;
      top: 0;
    }

    tbody tr:last-child td { border-bottom: 0; }

    .status {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 12px;
      background: rgba(15, 118, 110, 0.1);
      color: var(--teal-dark);
    }

    .status.cancelled {
      background: rgba(227, 93, 79, 0.11);
      color: #9f2d24;
    }

    .row-actions {
      display: flex;
      gap: 8px;
      white-space: nowrap;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 34px 12px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 12px);
      width: min(420px, calc(100% - 28px));
      background: #172026;
      color: #fff;
      border-radius: 8px;
      padding: 13px 14px;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
      font-size: 14px;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 720px) {
      header { display: block; }
      .toolbar { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1>CORTIS 预约管理</h1>
        <p class="sub">查看预约者信息、确认或取消场次。管理员口令不会展示给用户。</p>
      </div>
      <a href="./index.html">返回预约页</a>
    </header>

    <section class="panel">
      <div class="toolbar">
        <label>管理员口令
          <input id="adminToken" type="password" placeholder="输入后台口令" />
        </label>
        <label>状态筛选
          <select id="statusFilter">
            <option value="all">全部</option>
            <option value="pending">待确认</option>
            <option value="confirmed">已确认</option>
            <option value="cancelled">已取消</option>
          </select>
        </label>
        <button id="loadBtn" type="button">刷新</button>
        <button id="exportBtn" class="secondary" type="button">导出 CSV</button>
      </div>

      <div class="stats">
        <div class="stat"><b id="totalCount">0</b><span>总预约</span></div>
        <div class="stat"><b id="pendingCount">0</b><span>待确认</span></div>
        <div class="stat"><b id="confirmedCount">0</b><span>已确认</span></div>
        <div class="stat"><b id="cancelledCount">0</b><span>已取消</span></div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>日期</th>
              <th>时间</th>
              <th>昵称</th>
              <th>手机号</th>
              <th>来源</th>
              <th>金额</th>
              <th>状态</th>
              <th>提交时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="bookingRows">
            <tr><td class="empty" colspan="9">输入管理员口令后刷新</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const CONFIG = {
      apiUrl: '/api/bookings',
      statusUrl: '/api/status'
    };

    const rowsEl = document.querySelector('#bookingRows');
    const loadBtn = document.querySelector('#loadBtn');
    const exportBtn = document.querySelector('#exportBtn');
    const tokenEl = document.querySelector('#adminToken');
    const statusFilterEl = document.querySelector('#statusFilter');
    const toast = document.querySelector('#toast');
    let bookings = [];

    tokenEl.value = localStorage.getItem('adminToken') || '';

    function apiReady() {
      if (window.location.protocol === 'file:') return false;
      const host = window.location.hostname || '';
      if (host.endsWith('github.io') || host.endsWith('gitee.io')) return false;
      return Boolean(CONFIG.apiUrl);
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 2600);
    }

    function statusLabel(status) {
      return {
        pending: '待确认',
        confirmed: '已确认',
        cancelled: '已取消'
      }[status] || status;
    }

    function updateStats() {
      document.querySelector('#totalCount').textContent = bookings.length;
      document.querySelector('#pendingCount').textContent = bookings.filter(item => item.status === 'pending').length;
      document.querySelector('#confirmedCount').textContent = bookings.filter(item => item.status === 'confirmed').length;
      document.querySelector('#cancelledCount').textContent = bookings.filter(item => item.status === 'cancelled').length;
    }

    function renderRows() {
      const filter = statusFilterEl.value;
      const visible = filter === 'all' ? bookings : bookings.filter(item => item.status === filter);
      updateStats();

      if (!visible.length) {
        rowsEl.innerHTML = '<tr><td class="empty" colspan="9">暂无预约记录</td></tr>';
        return;
      }

      rowsEl.innerHTML = visible.map(item => `
        <tr>
          <td>${item.date || ''} ${item.weekday || ''}</td>
          <td>${item.time || ''}</td>
          <td>${item.name || ''}</td>
          <td>${item.phone || ''}</td>
          <td>${item.source || ''}</td>
          <td>¥${item.price || 39}</td>
          <td><span class="status ${item.status === 'cancelled' ? 'cancelled' : ''}">${statusLabel(item.status)}</span></td>
          <td>${item.createdAt || ''}</td>
          <td>
            <div class="row-actions">
              <button class="gold" type="button" onclick="updateStatus('${item.id}', 'confirmed')">确认</button>
              <button class="warn" type="button" onclick="updateStatus('${item.id}', 'cancelled')">取消</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    async function loadBookings() {
      const token = tokenEl.value.trim();
      if (!apiReady()) {
        const demoBookings = JSON.parse(localStorage.getItem('demoBookings') || '[]');
        bookings = demoBookings;
        renderRows();
        showToast('当前为本地演示模式，已加载本地预约信息。');
        return;
      }
      if (!token) {
        showToast('请输入管理员口令。');
        return;
      }

      localStorage.setItem('adminToken', token);
      loadBtn.disabled = true;
      loadBtn.textContent = '读取中';
      try {
        const response = await fetch(`${CONFIG.apiUrl}?action=list&token=${encodeURIComponent(token)}`);
        const data = await response.json();
        if (!data.ok) throw new Error(data.message || '读取失败');
        bookings = data.bookings || [];
        renderRows();
      } catch (error) {
        showToast(error.message || '读取失败，请检查接口地址和口令。');
      } finally {
        loadBtn.disabled = false;
        loadBtn.textContent = '刷新';
      }
    }

    async function updateStatus(id, status) {
      const token = tokenEl.value.trim();
      if (!apiReady()) {
        showToast('请通过本地服务打开 admin.html，而不是直接用文件方式打开。');
        return;
      }
      if (!token) {
        showToast('请输入管理员口令。');
        return;
      }
      try {
        const response = await fetch(CONFIG.statusUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json;charset=utf-8' },
          body: JSON.stringify({ token, id, status })
        });
        const data = await response.json();
        if (!data.ok) throw new Error(data.message || '操作失败');
        showToast('状态已更新。');
        await loadBookings();
      } catch (error) {
        showToast(error.message || '操作失败。');
      }
    }

    function exportCsv() {
      if (!bookings.length) {
        showToast('暂无可导出的预约记录。');
        return;
      }
      const header = ['日期', '星期', '时间', '昵称', '手机号', '来源', '金额', '状态', '提交时间'];
      const body = bookings.map(item => [
        item.date, item.weekday, item.time, item.name, item.phone, item.source, item.price, statusLabel(item.status), item.createdAt
      ]);
      const csv = [header, ...body]
        .map(row => row.map(value => `"${String(value || '').replace(/"/g, '""')}"`).join(','))
        .join('\n');
      const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'cortis-bookings.csv';
      link.click();
      URL.revokeObjectURL(url);
    }

    loadBtn.addEventListener('click', loadBookings);
    exportBtn.addEventListener('click', exportCsv);
    statusFilterEl.addEventListener('change', renderRows);
  </script>
</body>
</html>
